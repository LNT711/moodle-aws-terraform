services:
  moodle-db:
    image: bitnami/mariadb:10.6
    container_name: moodle-db
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=moodle
      - MARIADB_DATABASE=moodle
      - MARIADB_USER=moodleuser
      - MARIADB_PASSWORD=M00dl3P4ss
    volumes:
      - moodle_db_data:/bitnami/mariadb
    networks:
      - moodle-net2

  moodle-app:
    image: moodle-tfm 
    container_name: moodle-app
    restart: always
    depends_on:
      - moodle-db
    ports:
      - "9002:8080"
    environment:
      - MOODLE_DATABASE_HOST=moodle-db
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_NAME=moodle
      - MOODLE_DATABASE_USER=moodleuser
      - MOODLE_DATABASE_PASSWORD=M00dl3P4ss
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=adminpass
      - MOODLE_EMAIL=admin@moodle.com
      - MOODLE_SKIP_BOOTSTRAP=no
    volumes:
      - moodle_data:/bitnami/moodle
    networks:
      - moodle-net2

volumes:
  moodle_db_data:
  moodle_data:

networks:
  moodle-net2:
    driver: bridge
